<app-page-header title="Looking for Role? Search here!">
  <p-button label="Create Role" icon="pi pi-plus" (onClick)="createRole()"></p-button>
</app-page-header>

<div class="p-3">
  <p-accordion [(activeIndex)]="activeTabIndex">
    <p-accordionTab header="Search">
      <div [formGroup]="filterForm">
        <div class="grid">
          <div class="col-12 md:col-4 flex flex-column gap-2">
            <label for="filterName">Name</label>
            <input id="filterName" type="text" pInputText formControlName="name"
              placeholder="Search by name" (keyup.enter)="search(dt)" />
          </div>
          <div class="col-12 md:col-4 flex flex-column gap-2">
            <label for="filterCode">Code</label>
            <input id="filterCode" type="text" pInputText formControlName="code"
              placeholder="Search by code" (keyup.enter)="search(dt)" />
          </div>
        </div>
        <div class="search-actions">
          <p-button label="Search" icon="pi pi-search" (onClick)="search(dt)"></p-button>
          <p-button label="Clear" icon="pi pi-times" styleClass="p-button-outlined p-button-secondary" (onClick)="clearFilters()"></p-button>
        </div>
      </div>
    </p-accordionTab>

    <p-accordionTab header="Roles">
      <p-table #dt [value]="roles" [lazy]="true" (onLazyLoad)="fetchRoles($event)" [paginator]="true"
        [rows]="rows" [totalRecords]="totalRecords" [loading]="loading" [rowsPerPageOptions]="[10, 20, 50]"
        responsiveLayout="scroll" dataKey="id" selectionMode="single" [(selection)]="selectedRole"
        (onRowSelect)="viewRole($event.data)">
        <ng-template pTemplate="header">
          <tr>
            <th>Name</th>
            <th>Code</th>
            <th>Description</th>
            <th>Permissions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-role>
          <tr class="selectable-row" [pSelectableRow]="role">
            <td>{{ role.name }}</td>
            <td>{{ role.code }}</td>
            <td>{{ role.description || 'N/A' }}</td>
            <td>{{ role.permissions?.length || 0 }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center">No roles found.</td>
          </tr>
        </ng-template>
      </p-table>
    </p-accordionTab>
  </p-accordion>
</div>
