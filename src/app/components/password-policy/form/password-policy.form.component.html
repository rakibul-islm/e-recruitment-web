<app-page-header [title]="'passwordPolicy.formTitle' | translate">
  <p-button [label]="'common.save' | translate" icon="pi pi-check" (onClick)="submit()"></p-button>
  <p-button [label]="'common.back' | translate" icon="pi pi-arrow-left" styleClass="p-button-secondary" (onClick)="navigateToView()"></p-button>
</app-page-header>

<div class="flex justify-content-center mt-3 px-3">
  <p-card class="page-card">
    <form *ngIf="passwordPolicyForm" [formGroup]="passwordPolicyForm" (ngSubmit)="submit()">
      <div class="flex flex-column gap-4 mt-3">
        <h3 class="form-section-title">{{ 'passwordPolicy.lengthRules' | translate }}</h3>

        <div class="grid">
          <div class="col-12 md:col-4">
            <p-floatLabel>
              <input id="policyMinLength" type="number" formControlName="minLength" pInputText class="w-full" />
              <label for="policyMinLength">{{ 'passwordPolicy.minLength' | translate }}</label>
            </p-floatLabel>
            <small class="p-error" *ngIf="passwordPolicyForm.controls['minLength'].touched && passwordPolicyForm.controls['minLength'].errors?.['required']">
              {{ 'passwordPolicy.minLengthRequired' | translate }}</small>
          </div>

          <div class="col-12 md:col-4">
            <p-floatLabel>
              <input id="policyMaxLength" type="number" formControlName="maxLength" pInputText class="w-full" />
              <label for="policyMaxLength">{{ 'passwordPolicy.maxLength' | translate }}</label>
            </p-floatLabel>
            <small class="p-error" *ngIf="passwordPolicyForm.controls['maxLength'].touched && passwordPolicyForm.controls['maxLength'].errors?.['required']">
              {{ 'passwordPolicy.maxLengthRequired' | translate }}</small>
          </div>
        </div>

        <h3 class="form-section-title">{{ 'passwordPolicy.complexityRules' | translate }}</h3>

        <div class="grid">
          <div class="col-6 md:col-3 flex align-items-center gap-2">
            <p-checkbox inputId="policyRequireUppercase" formControlName="requireUppercase" [binary]="true"></p-checkbox>
            <label for="policyRequireUppercase">{{ 'passwordPolicy.requireUppercase' | translate }}</label>
          </div>
          <div class="col-6 md:col-3 flex align-items-center gap-2">
            <p-checkbox inputId="policyRequireLowercase" formControlName="requireLowercase" [binary]="true"></p-checkbox>
            <label for="policyRequireLowercase">{{ 'passwordPolicy.requireLowercase' | translate }}</label>
          </div>
          <div class="col-6 md:col-3 flex align-items-center gap-2">
            <p-checkbox inputId="policyRequireDigit" formControlName="requireDigit" [binary]="true"></p-checkbox>
            <label for="policyRequireDigit">{{ 'passwordPolicy.requireDigit' | translate }}</label>
          </div>
          <div class="col-6 md:col-3 flex align-items-center gap-2">
            <p-checkbox inputId="policyRequireSpecialChar" formControlName="requireSpecialChar" [binary]="true"></p-checkbox>
            <label for="policyRequireSpecialChar">{{ 'passwordPolicy.requireSpecialChar' | translate }}</label>
          </div>
          <div class="col-6 md:col-3 flex align-items-center gap-2">
            <p-checkbox inputId="policyDisallowUserInfo" formControlName="disallowUserInfoInPassword" [binary]="true"></p-checkbox>
            <label for="policyDisallowUserInfo">{{ 'passwordPolicy.disallowUserInfo' | translate }}</label>
          </div>
        </div>
      </div>
    </form>
  </p-card>
</div>
