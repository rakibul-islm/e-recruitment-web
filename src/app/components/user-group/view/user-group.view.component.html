<app-page-header title="User Group Details">
  <p-button label="Edit" icon="pi pi-pencil" [routerLink]="['/user-groups', userGroupId, 'edit']"></p-button>
  <p-button label="Delete" icon="pi pi-trash" styleClass="p-button-danger" (onClick)="deleteUserGroup()"></p-button>
  <p-button label="Back" icon="pi pi-arrow-left" styleClass="p-button-secondary" routerLink="/user-groups"></p-button>
</app-page-header>

<div class="flex justify-content-center mt-3 px-3">
  <p-card class="page-card">
    <h3 class="form-section-title">Basic Info</h3>
    <table class="detail-table">
      <tbody>
        <tr>
          <td class="detail-label">Name</td>
          <td class="detail-value">{{ userGroup.name || 'N/A' }}</td>
        </tr>
        <tr>
          <td class="detail-label">Description</td>
          <td class="detail-value">{{ userGroup.description || 'N/A' }}</td>
        </tr>
      </tbody>
    </table>

    <h3 class="form-section-title">Roles</h3>
    <p-table [value]="userGroup.roles || []" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Code</th>
          <th>Description</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-role>
        <tr>
          <td>{{ role.name }}</td>
          <td>{{ role.code }}</td>
          <td>{{ role.description || 'N/A' }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="text-center">No roles assigned.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
