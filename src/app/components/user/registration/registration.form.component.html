<div class="flex justify-content-center align-items-center min-h-screen p-4">
  <p-card class="register-card" styleClass="register-card-surface">
    <ng-template pTemplate="title">
      <div class="text-center">Sign Up</div>
    </ng-template>

    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="flex flex-column gap-4 mt-3">
        <!-- Full Name -->
        <div>
          <p-floatLabel>
            <input id="fullName" type="text" formControlName="fullName" pInputText class="w-full" />
            <label for="fullName">Full Name</label>
          </p-floatLabel>
          <small class="p-error" *ngIf="registerForm.controls['fullName'].touched && registerForm.controls['fullName'].errors?.['required']">
            Full name is required.</small>
        </div>

        <!-- Email -->
        <div>
          <p-floatLabel>
            <input id="email" type="email" formControlName="email" pInputText class="w-full" />
            <label for="email">Email</label>
          </p-floatLabel>
          <ng-container *ngIf="registerForm.controls['email'].touched">
            <small class="p-error" *ngIf="registerForm.controls['email'].errors?.['required']">Email is required.</small>
            <small class="p-error" *ngIf="registerForm.controls['email'].errors?.['email']">Enter a valid email.</small>
          </ng-container>
        </div>

        <!-- Mobile -->
        <div>
          <p-floatLabel>
            <input id="mobile" type="text" formControlName="mobile" pInputText class="w-full" />
            <label for="mobile">Mobile Number</label>
          </p-floatLabel>
          <ng-container *ngIf="registerForm.controls['mobile'].touched">
            <small class="p-error" *ngIf="registerForm.controls['mobile'].errors?.['required']">Mobile number is required.</small>
            <small class="p-error" *ngIf="registerForm.controls['mobile'].errors?.['pattern']">Mobile number must be 11 digits.</small>
          </ng-container>
        </div>

        <!-- Password -->
        <div>
          <p-floatLabel>
            <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="false"
              styleClass="w-full" inputStyleClass="w-full"></p-password>
            <label for="password">Password</label>
          </p-floatLabel>
          <ng-container *ngIf="registerForm.controls['password'].touched">
            <small class="p-error" *ngIf="registerForm.controls['password'].errors?.['required']">Password is required.</small>
            <small class="p-error" *ngIf="registerForm.controls['password'].errors?.['minlength']">Password must be at least 6 characters.</small>
          </ng-container>
        </div>

        <!-- Confirm Password -->
        <div>
          <p-floatLabel>
            <p-password id="confirmPassword" formControlName="confirmPassword" [toggleMask]="true" [feedback]="false"
              styleClass="w-full" inputStyleClass="w-full"></p-password>
            <label for="confirmPassword">Confirm Password</label>
          </p-floatLabel>
          <ng-container *ngIf="registerForm.controls['confirmPassword'].touched">
            <small class="p-error" *ngIf="registerForm.controls['confirmPassword'].errors?.['required']">Confirm password is required.</small>
            <small class="p-error" *ngIf="registerForm.hasError('passwordMismatch')">Passwords do not match.</small>
          </ng-container>
        </div>

        <p-button type="submit" label="Sign Up" styleClass="w-full"></p-button>
      </div>

      <p class="text-sm text-center mt-4 mb-0">
        Already have an account?
        <a routerLink="/login" class="text-primary font-semibold ml-1 white-space-nowrap">
          Sign in
        </a>
      </p>
    </form>
  </p-card>
</div>
