<app-page-header title="Edit Profile">
  <p-button label="Update" icon="pi pi-sync" (onClick)="save()"></p-button>
  <p-button label="Back" icon="pi pi-arrow-left" (onClick)="navigateToProfile()"></p-button>
</app-page-header>

<div class="flex justify-content-center mt-6 px-3">
  <p-card class="profile-edit-card">
    <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="save()">
      <div class="flex flex-column gap-4 mt-3">
        <div>
          <p-floatLabel>
            <input id="editFullName" type="text" formControlName="fullName" pInputText class="w-full" />
            <label for="editFullName">Full Name</label>
          </p-floatLabel>
          <small class="p-error" *ngIf="editForm.controls['fullName'].touched && editForm.controls['fullName'].errors?.['required']">
            Full name is required.</small>
        </div>

        <div>
          <p-floatLabel>
            <input id="editEmail" type="email" formControlName="email" pInputText class="w-full" />
            <label for="editEmail">Email</label>
          </p-floatLabel>
          <ng-container *ngIf="editForm.controls['email'].touched">
            <small class="p-error" *ngIf="editForm.controls['email'].errors?.['required']">Email is required.</small>
            <small class="p-error" *ngIf="editForm.controls['email'].errors?.['email']">Enter a valid email.</small>
          </ng-container>
        </div>

        <div>
          <p-floatLabel>
            <input id="editAddress" type="text" formControlName="address" pInputText class="w-full" />
            <label for="editAddress">Address</label>
          </p-floatLabel>
        </div>

        <div>
          <p-floatLabel>
            <input id="editPhone" type="text" formControlName="phone" pInputText class="w-full" />
            <label for="editPhone">Phone</label>
          </p-floatLabel>
        </div>

        <div>
          <p-floatLabel>
            <input id="editMobile" type="text" formControlName="mobile" pInputText class="w-full" />
            <label for="editMobile">Mobile Number</label>
          </p-floatLabel>
          <ng-container *ngIf="editForm.controls['mobile'].touched">
            <small class="p-error" *ngIf="editForm.controls['mobile'].errors?.['required']">Mobile number is required.</small>
            <small class="p-error" *ngIf="editForm.controls['mobile'].errors?.['pattern']">Mobile number must be 11 digits.</small>
          </ng-container>
        </div>
      </div>
    </form>
  </p-card>
</div>
