<div class="flex justify-content-center mt-6 px-3">
  <p-card class="profile-card">
    <div class="flex justify-content-center mb-4">
      <p-avatar [image]="profile.imageBase64" size="xlarge" shape="circle" styleClass="profile-avatar"></p-avatar>
    </div>

    <div class="flex flex-column gap-4 mt-3">
      <p-floatLabel>
        <input id="profileFullName" type="text" pInputText class="w-full" [value]="profile.fullName" readonly />
        <label for="profileFullName">Full Name</label>
      </p-floatLabel>

      <p-floatLabel>
        <input id="profileEmail" type="text" pInputText class="w-full" [value]="profile.email" readonly />
        <label for="profileEmail">Email</label>
      </p-floatLabel>

      <p-floatLabel>
        <input id="profileAddress" type="text" pInputText class="w-full" [value]="profile.address" readonly />
        <label for="profileAddress">Address</label>
      </p-floatLabel>

      <p-floatLabel>
        <input id="profilePhone" type="text" pInputText class="w-full" [value]="profile.phone || 'N/A'" readonly />
        <label for="profilePhone">Phone</label>
      </p-floatLabel>

      <p-floatLabel>
        <input id="profileMobile" type="text" pInputText class="w-full" [value]="profile.mobile || 'N/A'" readonly />
        <label for="profileMobile">Mobile</label>
      </p-floatLabel>
    </div>
  </p-card>
</div>
