<div class="flex justify-content-center align-items-center min-h-screen p-4">
  <p-card class="login-card" styleClass="login-card-surface">
    <ng-template pTemplate="title">Sign in</ng-template>

    <form (submit)="login()">
      <div class="flex flex-column gap-4 mt-3">
        <p-floatLabel>
          <input id="username" name="username" type="text" pInputText [(ngModel)]="username" required
            class="w-full" />
          <label for="username">Username</label>
        </p-floatLabel>

        <p-floatLabel>
          <p-password id="password" name="password" [(ngModel)]="password" required
            [toggleMask]="true" [feedback]="false" styleClass="w-full"
            inputStyleClass="w-full">
          </p-password>
          <label for="password">Password</label>
        </p-floatLabel>

        <div class="flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="flex align-items-center gap-2">
            <p-checkbox inputId="remember-me" [binary]="true"></p-checkbox>
            <label for="remember-me">Remember me</label>
          </div>
          <a href="javascript:void(0);" class="text-primary text-sm font-semibold">
            Forgot Password?
          </a>
        </div>

        <p-button type="submit" label="Sign in" styleClass="w-full"></p-button>

        <p class="text-sm text-center m-0">
          Don't have an account
          <a routerLink="/signup" class="text-primary font-semibold ml-1 white-space-nowrap">
            Register here
          </a>
        </p>
      </div>
    </form>

    <hr class="my-4" />

    <div class="flex justify-content-center align-items-center gap-2">
      <img src="/assets/images/app-logo.png" alt="e-recruitment logo" class="w-2rem h-2rem" />
      <span class="text-lg font-semibold">E-RECRUITMENT</span>
    </div>
  </p-card>
</div>
