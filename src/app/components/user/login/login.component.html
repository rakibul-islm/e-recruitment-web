<div class="flex justify-content-center align-items-center min-h-screen p-4">
  <p-card class="login-card" styleClass="login-card-surface">
    <ng-template pTemplate="title">Sign in</ng-template>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="flex flex-column gap-4 mt-3">
        <div>
          <p-floatLabel>
            <input id="email" type="email" formControlName="email" pInputText class="w-full" />
            <label for="email">Email</label>
          </p-floatLabel>
          <ng-container *ngIf="loginForm.controls['email'].touched">
            <small class="p-error" *ngIf="loginForm.controls['email'].errors?.['required']">Email is required.</small>
            <small class="p-error" *ngIf="loginForm.controls['email'].errors?.['email']">Enter a valid email.</small>
          </ng-container>
        </div>

        <div>
          <p-floatLabel>
            <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="false"
              styleClass="w-full" inputStyleClass="w-full"></p-password>
            <label for="password">Password</label>
          </p-floatLabel>
          <small class="p-error" *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].errors?.['required']">
            Password is required.</small>
        </div>

        <div class="flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="flex align-items-center gap-2">
            <p-checkbox inputId="remember-me" formControlName="rememberMe" [binary]="true"></p-checkbox>
            <label for="remember-me">Remember me</label>
          </div>
          <a href="javascript:void(0);" class="text-primary text-sm font-semibold">
            Forgot Password?
          </a>
        </div>

        <p-button type="submit" label="Sign in" styleClass="w-full"></p-button>

        <p class="text-sm text-center m-0">
          Don't have an account
          <a routerLink="/signup" class="text-primary font-semibold ml-1 white-space-nowrap">
            Register here
          </a>
        </p>
      </div>
    </form>

    <div class="flex align-items-center gap-3 mt-2 mb-2">
      <hr class="flex-1 m-0" />
      <span class="text-sm">or</span>
      <hr class="flex-1 m-0" />
    </div>

    <div class="flex justify-content-center">
      <div id="google-button"></div>
    </div>

    <hr class="my-2" />

    <div class="flex justify-content-center align-items-center mt-4 gap-2">
      <img src="/assets/images/app-logo.png" alt="e-recruitment logo" class="w-2rem h-2rem" />
      <span class="text-lg font-semibold">E-RECRUITMENT</span>
    </div>
  </p-card>
</div>
