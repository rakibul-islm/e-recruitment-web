<app-page-header title="Permission Details">
  <p-button label="Edit" icon="pi pi-pencil" [routerLink]="['/permissions', permissionId, 'edit']"></p-button>
  <p-button label="Delete" icon="pi pi-trash" styleClass="p-button-danger" (onClick)="deletePermission()"></p-button>
  <p-button label="Back" icon="pi pi-arrow-left" styleClass="p-button-secondary" (onClick)="navigateToSearch()"></p-button>
</app-page-header>

<div class="flex justify-content-center mt-3 px-3">
  <p-card class="page-card">
    <h3 class="form-section-title">Basic Info</h3>
    <table class="detail-table">
      <tbody>
        <tr>
          <td class="detail-label">Name</td>
          <td class="detail-value">{{ permission.name || 'N/A' }}</td>
        </tr>
        <tr>
          <td class="detail-label">Authority</td>
          <td class="detail-value">{{ permission.authority || 'N/A' }}</td>
        </tr>
        <tr>
          <td class="detail-label">Module</td>
          <td class="detail-value">{{ permission.module || 'N/A' }}</td>
        </tr>
        <tr>
          <td class="detail-label">Route Name</td>
          <td class="detail-value">{{ permission.routeName || 'N/A' }}</td>
        </tr>
        <tr>
          <td class="detail-label">Description</td>
          <td class="detail-value">{{ permission.description || 'N/A' }}</td>
        </tr>
      </tbody>
    </table>
  </p-card>
</div>
